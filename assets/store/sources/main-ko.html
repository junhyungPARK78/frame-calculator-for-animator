<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1e1e2e;
    --bg2: #313244;
    --text: #cdd6f4;
    --muted: #a6adc8;
    --accent: #89b4fa;
    --green: #40a02b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 1280px; height: 800px;
    display: grid; grid-template-columns: 1fr 1fr; align-items: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(137,180,250,0.18) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(166,227,161,0.10) 0%, transparent 45%),
      var(--bg);
  }
  .left { padding: 0 64px 0 88px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg2); color: var(--accent);
    padding: 8px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    margin-bottom: 28px;
  }
  .badge::before { content:""; width:8px; height:8px; background:var(--accent); border-radius:50%; }
  h1 {
    font-size: 64px; font-weight: 800; line-height: 1.1;
    letter-spacing: -0.02em; margin-bottom: 22px;
  }
  h1 .accent { color: var(--accent); }
  h1 .green  { color: #a6e3a1; }
  .lede {
    font-size: 22px; line-height: 1.55;
    color: var(--muted); margin-bottom: 36px; max-width: 520px;
  }
  ul.features { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  ul.features li {
    display: flex; align-items: center; gap: 14px;
    font-size: 18px; color: var(--text);
  }
  ul.features li::before {
    content:""; width:22px; height:22px; background: var(--bg2); border-radius:50%;
    flex-shrink:0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2389b4fa' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    background-repeat:no-repeat; background-position:center; background-size:14px;
  }
  .right { display:flex; align-items:center; justify-content:center; padding: 0 72px 0 32px; }
  .shot-wrap {
    position: relative; border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 8px 24px rgba(137,180,250,0.18);
    border: 1px solid rgba(137,180,250,0.18);
  }
  .shot-wrap img { display:block; width: 560px; height:auto; }
</style>
</head>
<body>
  <div class="stage">
    <div class="left">
      <div class="badge">크롬 확장 · 사이드 패널</div>
      <h1>
        <span class="accent">프레임</span> ↔ <span class="green">초</span>.<br>
        즉시 변환.
      </h1>
      <p class="lede">
        애니메이터를 위한 프레임/타임코드 계산기.
        컷을 합산하고, FPS를 전환하고, 프로젝트를 저장 — Chrome 사이드 패널에서 바로.
      </p>
      <ul class="features">
        <li>24 / 30 / 60 fps 프리셋 + 커스텀</li>
        <li>프로젝트 저장 · 관리 · 내보내기</li>
        <li>다크 / 라이트 · KO · JA · EN</li>
      </ul>
    </div>
    <div class="right">
      <div class="shot-wrap">
        <img src="preview-ko.png" alt="프레임 계산기 스크린샷">
      </div>
    </div>
  </div>
</body>
</html>
