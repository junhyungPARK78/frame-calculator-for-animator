<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1e1e2e;
    --bg2: #313244;
    --text: #cdd6f4;
    --muted: #a6adc8;
    --accent: #89b4fa;
    --green: #a6e3a1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 440px;
    height: 280px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 440px;
    height: 280px;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(circle at 12% 18%, rgba(137,180,250,0.22) 0%, transparent 55%),
      radial-gradient(circle at 95% 95%, rgba(166,227,161,0.12) 0%, transparent 50%),
      var(--bg);
  }
  .top {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg2);
    color: var(--accent);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }
  h1 {
    font-size: 40px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  h1 .accent { color: var(--accent); }
  h1 .green  { color: var(--green); }
  .sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="top">
      <img class="icon" src="icon128.png" alt="">
      <div class="badge">애니메이터를 위한</div>
    </div>
    <h1>
      <span class="accent">프레임</span> ↔ <span class="green">초</span>.
    </h1>
    <p class="sub">
      Chrome 사이드 패널에서 바로,<br>
      프레임 &amp; 타임코드 계산기.
    </p>
  </div>
</body>
</html>
