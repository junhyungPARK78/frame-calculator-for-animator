<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1e1e2e;
    --bg2: #313244;
    --text: #cdd6f4;
    --muted: #a6adc8;
    --accent: #89b4fa;
    --green: #40a02b;
    --red: #f38ba8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 800px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 1280px;
    height: 800px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(137,180,250,0.18) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(166,227,161,0.10) 0%, transparent 45%),
      var(--bg);
  }
  .left {
    padding: 0 64px 0 88px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg2);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }
  .badge::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }
  h1 {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 22px;
  }
  h1 .accent { color: var(--accent); }
  h1 .green  { color: #a6e3a1; }
  .lede {
    font-size: 22px;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 36px;
    max-width: 520px;
  }
  ul.features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  ul.features li {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 18px;
    color: var(--text);
  }
  ul.features li::before {
    content: "";
    width: 22px;
    height: 22px;
    background: var(--bg2);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2389b4fa' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 14px;
  }
  .right {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 72px 0 32px;
  }
  .shot-wrap {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      0 8px 24px rgba(137,180,250,0.18);
    border: 1px solid rgba(137,180,250,0.18);
  }
  .shot-wrap img {
    display: block;
    width: 560px;
    height: auto;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="left">
      <div class="badge">CHROME EXTENSION · SIDE PANEL</div>
      <h1>
        <span class="accent">Frame</span> ↔ <span class="green">Seconds</span>.<br>
        Instant.
      </h1>
      <p class="lede">
        A frame &amp; timecode calculator built for animators.
        Add up cuts, switch FPS, save projects — right in Chrome's side panel.
      </p>
      <ul class="features">
        <li>24 / 30 / 60 fps presets + custom</li>
        <li>Save, manage &amp; export projects</li>
        <li>Dark / light · KO · JA · EN</li>
      </ul>
    </div>
    <div class="right">
      <div class="shot-wrap">
        <img src="preview-en.png" alt="Frame Calculator screenshot">
      </div>
    </div>
  </div>
</body>
</html>
